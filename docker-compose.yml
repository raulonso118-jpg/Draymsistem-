version: '3.8'

services:
  draymsistem:
    build: .
    container_name: draymsistem-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - TMP_DIR=/tmp
    volumes:
      - ./nvnb_data:/app/nvnb_data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
